# Crop suitability rule database (East-African dryland orientation).
# Calibrate with the agronomy partner before production rollout.
#
# Criterion forms:
#   window:    {hard_min, opt_min, opt_max, hard_max, weight}  -> trapezoid score
#   threshold: {min, weight}                                   -> 1 if value >= min,
#              linear down to 0 at 60% of min (frost/salinity style gates)
# Rainfall is evaluated against EFFECTIVE rainfall: climatology + any
# supplemental irrigation passed to the engine (mm/yr).
version: 1
weights_must_sum_note: "per-criterion weights are normalized per crop"

crops:
  - name: maize
    category: cereal
    criteria:
      effective_rainfall_mm: {hard_min: 350, opt_min: 500, opt_max: 900, hard_max: 1300, weight: 0.30}
      temp_mean_c: {hard_min: 14, opt_min: 20, opt_max: 30, hard_max: 35, weight: 0.15}
      coldest_month_min_c: {min: 4, weight: 0.10}
      ph: {hard_min: 5.0, opt_min: 5.5, opt_max: 7.5, hard_max: 8.5, weight: 0.20}
      clay_pct: {min: 8, max: 45, weight: 0.15}
      soc_gkg: {min: 10, weight: 0.10}
    notes: ["heavy feeder - split N applications", "striga risk in continuous cereal rotations"]

  - name: sorghum
    category: cereal
    criteria:
      effective_rainfall_mm: {hard_min: 250, opt_min: 400, opt_max: 800, hard_max: 1100, weight: 0.30}
