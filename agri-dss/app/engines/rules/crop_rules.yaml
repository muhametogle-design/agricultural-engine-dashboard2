      coldest_month_min_c: {min: 5, weight: 0.10}
      ph: {hard_min: 5.0, opt_min: 5.5, opt_max: 8.0, hard_max: 9.0, weight: 0.20}
      clay_pct: {min: 5, max: 50, weight: 0.15}
      soc_gkg: {min: 6, weight: 0.10}
    notes: ["drought-escape short-duration varieties below 350 mm effective rainfall"]

